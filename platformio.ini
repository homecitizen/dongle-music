; ============================================================
;  dongle_music — PlatformIO configuration
;  ESP32-S3 + ST7735 80×160 · Apple Music Style
; ============================================================

; src_dir DEBE estar en [platformio], no en [env]
[platformio]
src_dir = firmware/src

[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; Puerto serie: PlatformIO lo detecta solo. Si tienes varios dispositivos,
; descomenta y pon el tuyo (ls /dev/cu.usbmodem* en macOS).
;upload_port  = /dev/cu.usbmodemXXXX
;monitor_port = /dev/cu.usbmodemXXXX

monitor_speed = 921600
upload_speed  = 460800

; Directorio donde está main.cpp — ya definido arriba en [platformio]

; Habilitar USB CDC On Boot (equivalente al ajuste de Arduino IDE)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Librerías — PlatformIO las descarga automáticamente
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
    adafruit/Adafruit GFX Library               @ ^1.11.9
    adafruit/Adafruit BusIO                     @ ^1.16.1
